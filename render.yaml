# Render Blueprint for the Express API (server/). See README → Deployment.
# Secrets are never stored here: values marked "sync: false" are entered in
# the Render dashboard, and JWT_SECRET is generated by Render.
services:
  - type: web
    name: shortify-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI # MongoDB Atlas connection string
        sync: false
      - key: PUBLIC_BASE_URL # this service's URL, e.g. https://shortify-api.onrender.com
        sync: false
      - key: CLIENT_ORIGIN # the frontend URL, e.g. https://shortify.netlify.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY # Render runs one proxy in front of the app
        value: "1"
