# Render Blueprint: ONE web service that serves the website, the API (/api/...),
# and the short links (/<code>) from the same public HTTPS address,
# e.g. https://shortify.onrender.com/aB7xK9p. See README → Deployment.
#
# Secrets are never stored here: values marked "sync: false" are entered in the
# Render dashboard when the Blueprint is created, and JWT_SECRET is generated by Render.
services:
  - type: web
    name: shortify
    runtime: node
    # Build the React app (needs its dev dependencies, e.g. Vite), then install the API.
    buildCommand: npm ci --prefix client --include=dev && npm run build --prefix client && npm ci --prefix server --omit=dev
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI # MongoDB Atlas connection string, database "shortify"
        sync: false
      - key: PUBLIC_BASE_URL # this service's address, e.g. https://shortify.onrender.com (shown at the top of the service page)
        sync: false
      - key: CLIENT_DIST_DIR # the built website, served by this same server
        value: client/dist
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY # Render runs one proxy in front of the app
        value: "1"
